<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>일정관리 - 통합HUB</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app-shell">

    <!-- 사이드바 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">H</span>
        <span class="brand-name">통합HUB</span>
      </div>

      <nav class="nav">
        <div class="nav-section-label">도구</div>
        <a class="nav-item is-active" href="index.html">
          <span class="nav-icon">📅</span>
          <span>일정관리</span>
        </a>
        <a class="nav-item" href="../index.html">
          <span class="nav-icon">✓</span>
          <span>할 일 관리</span>
        </a>
        <a class="nav-item" href="../marathon/index.html">
          <span class="nav-icon">🏃</span>
          <span>마라톤 훈련일지</span>
        </a>
        <a class="nav-item" href="../golf/index.html">
          <span class="nav-icon">⛳</span>
          <span>골프 기록</span>
        </a>
        <a class="nav-item" href="../golflearn/index.html">
          <span class="nav-icon">📝</span>
          <span>골프학습일지</span>
        </a>
        <a class="nav-item" href="../ailearn/index.html">
          <span class="nav-icon">🤖</span>
          <span>AI학습일지</span>
        </a>
        <a class="nav-item" href="../blog/index.html">
          <span class="nav-icon">📰</span>
          <span>블로그 자동화</span>
        </a>
        <button class="nav-item is-disabled" disabled>
          <span class="nav-icon">＋</span>
          <span>새 도구 (예정)</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <span id="todayLabel"></span>
      </div>
    </aside>

    <!-- 메인 영역 -->
    <main class="main">

      <!-- 상단 바 -->
      <header class="topbar">
        <div>
          <h1 id="greeting">📅 일정관리</h1>
          <p class="subtitle" id="dateSubtitle"></p>
        </div>
        <div class="view-switch" role="tablist">
          <button class="view-btn is-active" data-view="daily">일별</button>
          <button class="view-btn" data-view="monthly">월별</button>
          <button class="view-btn" data-view="yearly">연간</button>
        </div>
      </header>

      <!-- 통계 타일 -->
      <section class="stat-row">
        <div class="stat-tile">
          <div class="stat-label">오늘 일정</div>
          <div class="stat-value" id="statToday">0 건</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">이번 주 일정</div>
          <div class="stat-value" id="statWeek">0 건</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">이번 달 일정</div>
          <div class="stat-value" id="statMonth">0 건</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">다음 일정</div>
          <div class="stat-value" id="statNextEvent">-</div>
          <div class="stat-sub" id="statNextEventMeta"></div>
        </div>
      </section>

      <!-- 이번 달 일정 전체 (항상 보이는 카드, 탭 전환과 무관) -->
      <section class="panel-card month-list-card">
        <div class="panel-card-header">
          <h2 id="monthEventListTitle">이번 달 일정 전체</h2>
        </div>
        <ul class="event-list" id="monthEventList"></ul>
        <p class="empty-state" id="monthEventEmpty" hidden>이번 달엔 등록된 일정이 없어요.</p>
      </section>

      <!-- 일별 뷰 -->
      <section class="view-panel is-active" id="view-daily">
        <div class="panel-card">
          <div class="panel-card-header panel-card-header--calendar">
            <button class="nav-arrow" id="prevDay">‹</button>
            <h2 id="dailyTitle">오늘</h2>
            <button class="nav-arrow" id="nextDay">›</button>
          </div>

          <p class="conflict-warning" id="conflictWarning" hidden></p>

          <form class="event-add-form" id="eventAddForm">
            <div class="form-row">
              <select id="eventStart" required></select>
              <span class="time-tilde">~</span>
              <select id="eventEnd"></select>
              <input type="text" id="eventTitle" placeholder="일정 제목" autocomplete="off" required />
              <select id="eventCategory">
                <option value="work">업무</option>
                <option value="personal">개인</option>
                <option value="appointment">약속</option>
                <option value="health">건강</option>
                <option value="etc">기타</option>
              </select>
            </div>
            <div class="form-row">
              <input type="text" id="eventMemo" placeholder="메모 (선택)" autocomplete="off" />
              <button type="submit">일정 추가</button>
            </div>
          </form>

          <div class="timeline-wrap">
            <div class="timeline" id="timeline"></div>
          </div>

          <ul class="event-list" id="eventList"></ul>
          <p class="empty-state" id="eventEmpty" hidden>이 날은 일정이 없어요.</p>
        </div>
      </section>

      <!-- 월별 뷰 -->
      <section class="view-panel" id="view-monthly">
        <div class="panel-card">
          <div class="panel-card-header panel-card-header--calendar">
            <button class="nav-arrow" id="prevMonth">‹</button>
            <h2 id="calendarTitle">2026년 10월</h2>
            <button class="nav-arrow" id="nextMonth">›</button>
          </div>

          <div class="calendar-weekdays">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="calendar-grid cat-cal" id="calendarGrid"></div>
        </div>

        <div class="panel-card">
          <h2>카테고리별 일정 수 (이번 달)</h2>
          <div class="chart-wrap" id="categoryBarChart"></div>
          <div class="legend-row cat-legend" id="categoryLegend"></div>
        </div>
      </section>

      <!-- 연간 뷰 -->
      <section class="view-panel" id="view-yearly">
        <div class="panel-card">
          <div class="panel-card-header panel-card-header--calendar">
            <button class="nav-arrow" id="prevYear">‹</button>
            <h2 id="yearTitle">2026년</h2>
            <button class="nav-arrow" id="nextYear">›</button>
          </div>
          <div class="chart-wrap" id="yearBarChart"></div>
        </div>

        <div class="panel-card">
          <h2>연간 요약</h2>
          <div class="year-summary-grid" id="yearSummary"></div>
        </div>
      </section>

    </main>
  </div>

<script src="app.js"></script>
</body>
</html>
