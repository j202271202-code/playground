<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;font-family:'Noto Sans KR',sans-serif;background:#0f3d2e;color:#1b2a22}
.wrap{padding:48px;background:linear-gradient(160deg,#0f3d2e 0%,#1f6b4a 55%,#2f8f5f 100%);}
.head{color:#fff;text-align:center;padding:24px 0 36px}
.tag{display:inline-block;background:#ffd54a;color:#4a3800;font-weight:700;font-size:26px;padding:6px 26px;border-radius:40px;letter-spacing:2px}
h1{font-size:76px;font-weight:900;margin-top:22px;line-height:1.2}
h1 small{display:block;font-size:34px;font-weight:500;opacity:.9;margin-bottom:6px}
.card{background:#fff;border-radius:28px;padding:34px 40px;margin-bottom:26px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.title{display:flex;align-items:center;gap:16px;font-size:36px;font-weight:900;color:#0f3d2e;margin-bottom:20px}
.num{width:52px;height:52px;border-radius:50%;background:#1f6b4a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}
.row{display:flex;gap:18px;font-size:31px;padding:11px 0;border-bottom:1px dashed #d5e3da;line-height:1.45}
.row:last-child{border:0}
.t{flex:0 0 150px;font-weight:900;color:#c62828}
.t.b{color:#1f6b4a}
.big{font-size:50px;font-weight:900;color:#c62828;line-height:1.3}
.sub{font-size:31px;margin-top:6px}
.hl{background:#fff3c4;padding:0 8px;border-radius:6px;font-weight:700}
.foot{text-align:center;color:#e8f5ec;font-size:27px;margin-top:6px;padding-bottom:6px}
</style></head><body><div class="wrap">
